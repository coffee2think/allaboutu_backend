# ========================================
# Server
# ========================================
server.port=2222


# ========================================
# Database - Oracle
# ========================================
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# ========================================
# JPA / Hibernate
# ========================================

# Hibernate가 실행하는 SQL을 콘솔에 출력
spring.jpa.show-sql=true

# Entity를 기준으로 DB 스키마를 자동으로 갱신
spring.jpa.hibernate.ddl-auto=validate

# JPA의 DDL 자동 생성 기능 사용 여부
spring.jpa.generate-ddl=false

# 사용할 데이터베이스 및 Hibernate Dialect
spring.jpa.database=oracle
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect

# Hibernate의 새로운 ID 생성 전략 사용 여부
spring.jpa.properties.hibernate.id.new_generator_mappings=false


# ========================================
# Logging
# ========================================

# Hibernate 로그 레벨
logging.level.org.hibernate=INFO

# Spring Security 디버그 로그
logging.level.org.springframework.security=DEBUG


# ========================================
# Jackson
# ========================================

# 직렬화할 필드가 없는 객체를 처리할 때 예외를 발생시키지 않음
spring.jackson.serialization.fail-on-empty-beans=false


# ========================================
# Multipart / File Upload
# ========================================

# 업로드 가능한 개별 파일의 최대 크기
spring.servlet.multipart.max-file-size=10MB

# Multipart 요청 전체의 최대 크기
spring.servlet.multipart.max-request-size=10MB


# ========================================
# File Storage
# ========================================

# 게시판 업로드 파일 경로
board_upload.path=classpath:/static/board_upload/

# 이미지 업로드 경로
img.upload-dir=/poketAi_workspace/allaboutu_springboot/src/main/resources/static/img

# 기존 업로드 경로 설정
# org.hdcd.upload-path=E:/upload


# ========================================
# Mail - Gmail SMTP
# ========================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.default-encoding=UTF-8

# Gmail 인증 정보
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

# SMTP 설정
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true


# ========================================
# JWT
# ========================================

# JWT 서명에 사용하는 Secret Key
application.security.jwt.secret-key=${JWT_SECRET_KEY}

# Access Token 만료 시간: 5시간
application.security.jwt.expiration=18000000

# Refresh Token 만료 시간: 10시간
application.security.jwt.refresh-token.expiration=36000000

# ========================================
# CORS
# ========================================
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}